<title>Migration Review Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: filterable step rail on the left; the selected step's two agent judgements, decision bar, and diff on the right; one column on phones. */
:root {
  --bg: #f6f6f3; --panel: #ffffff; --fg: #1c1e1b; --muted: #5c6159; --line: #dcdfd7;
  --accent: #2c6a4e; --accent-soft: #e2efe7; --code-bg: #f0f1ec;
  --ok: #2c6a4e; --mod: #8a5a00; --veto: #a33a2c; --mod-soft: #f7ecd6; --veto-soft: #f6dfda;
  --add-bg: #dcefdf; --del-bg: #f6dcd8; --diffmark: #fff3c4;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151715; --panel: #1d201d; --fg: #e5e8e1; --muted: #a2a89e; --line: #323731;
  --accent: #7cc4a0; --accent-soft: #22352b; --code-bg: #111311;
  --ok: #7cc4a0; --mod: #e2b04f; --veto: #ec8a7c; --mod-soft: #3a2f17; --veto-soft: #3f2420;
  --add-bg: #1f3a26; --del-bg: #43231f; --diffmark: #3d3714; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151715; --panel: #1d201d; --fg: #e5e8e1; --muted: #a2a89e; --line: #323731;
  --accent: #7cc4a0; --accent-soft: #22352b; --code-bg: #111311;
  --ok: #7cc4a0; --mod: #e2b04f; --veto: #ec8a7c; --mod-soft: #3a2f17; --veto-soft: #3f2420;
  --add-bg: #1f3a26; --del-bg: #43231f; --diffmark: #3d3714; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; margin-bottom: 10px }
h1 { font-size: 18px; font-weight: 600; margin: 0 }
.tally { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel) }
.pill b { font-weight: 600 }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; font-size: 13px }
select, .btn, input[type=text], textarea { font: 13px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px }
.app { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: start }
@media (max-width: 780px) { .app { grid-template-columns: minmax(0, 1fr) } nav { max-height: 200px } }
nav { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: calc(100vh - 120px); position: sticky; top: 14px }
nav h3 { margin: 0; padding: 6px 10px; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line) }
nav button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--fg); font: 12.5px var(--mono); padding: 6px 10px; cursor: pointer }
nav button[aria-current="true"] { background: var(--accent-soft) }
nav .b { margin-left: auto; font: 600 10px var(--sans); color: var(--muted); border-radius: 3px; padding: 0 4px }
nav .b.sev2 { color: var(--veto); border: 1px solid var(--veto) }
nav .b.sev1 { color: var(--mod); border: 1px solid var(--mod) }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none }
.st.approve { background: var(--ok); border-color: var(--ok) }
.st.modify { background: var(--mod); border-color: var(--mod) }
.st.veto { background: var(--veto); border-color: var(--veto) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
main { min-width: 0; display: grid; gap: 12px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0 }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline }
.meta h2 { font: 600 17px var(--mono); margin: 0 }
.meta span { color: var(--muted); font-size: 13px }
.judges { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 10px }
.judge { border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0 }
.judge h4 { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 3px 8px; font-size: 13px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere }
.kv dd.diffv { background: var(--diffmark); border-radius: 3px; padding: 0 3px }
.verdict { font: 500 12px var(--sans); border-radius: 4px; padding: 1px 7px; border: 1px solid var(--line) }
.verdict.yes { color: var(--ok); border-color: var(--ok) }
.verdict.no { color: var(--muted) }
.jnote { margin-top: 6px; font-size: 12.5px; color: var(--muted) }
.decide { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.btn { cursor: pointer; font-weight: 500 }
.btn.approve { border-color: var(--ok); color: var(--ok) }
.btn.modify { border-color: var(--mod); color: var(--mod) }
.btn.veto { border-color: var(--veto); color: var(--veto) }
.btn[aria-pressed="true"].approve { background: var(--accent-soft) }
.btn[aria-pressed="true"].modify { background: var(--mod-soft) }
.btn[aria-pressed="true"].veto { background: var(--veto-soft) }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--muted) }
.save { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums }
.save.err { color: var(--veto) }
fieldset { border: 0; padding: 0; margin: 10px 0 0; min-width: 0 }
legend { font-weight: 600; font-size: 13px; margin-bottom: 4px }
.opts { display: flex; flex-wrap: wrap; gap: 5px }
.opt { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: 12.5px var(--mono) }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 }
.chip { font: 12px var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; padding: 1px 7px; cursor: pointer }
.chip.x { border-style: dashed }
input[type=text] { width: 100%; font-family: var(--mono); background: var(--code-bg) }
textarea { width: 100%; min-height: 50px; resize: vertical }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 0; padding: 8px 0; overflow: auto; max-height: 60vh; font: 12px/1.45 var(--mono) }
pre .add { background: var(--add-bg); display: inline-block; min-width: 100% }
pre .del { background: var(--del-bg); display: inline-block; min-width: 100% }
pre .hunk { color: var(--accent) }
pre .meta { color: var(--muted) }
.note { color: var(--muted); font-size: 12.5px }
.banner { border: 1px solid var(--veto); color: var(--veto); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px }
.empty { color: var(--muted); padding: 10px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header>
  <h1>Migration Review Board</h1>
  <div class="tally" id="tally"><span class="pill">Loading saved decisions…</span></div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="filters">
  <label for="fsys">System</label>
  <select id="fsys"><option value="">All</option><option value="@system">System components</option><option value="@userspace">Userspace agents</option><option>Ames</option><option>Gall</option><option>Clay</option><option>Dojo</option><option>Hood</option><option>metadata-store</option><option>graph-store</option><option>azimuth</option><option>eth-watcher</option><option>roller</option><option>chat-cli</option></select>
  <label for="fsort">Order</label>
  <select id="fsort"><option value="priority">Conflicts first</option><option value="system">By system</option></select>
  <label for="fstat">Status</label>
  <select id="fstat"><option value="">All</option><option value="pending">Pending</option><option value="approve">Approved</option><option value="modify">Modified</option><option value="veto">Vetoed</option><option value="disagree">Agents disagree</option><option value="major">Kind or verdict differs</option></select>
  <span class="note">Keys: <kbd>a</kbd> approve A · <kbd>b</kbd> approve B · <kbd>m</kbd> modify · <kbd>v</kbd> veto · <kbd>j</kbd>/<kbd>k</kbd> next/previous</span>
</div>

<div class="app">
  <nav id="list" aria-label="Steps"></nav>
  <main>
    <section class="card" id="stepcard"></section>
    <section class="card">
      <div class="decide" id="decide"></div>
      <form id="form" autocomplete="off" hidden>
        <fieldset><legend>Kind</legend><div class="opts" id="kinds"></div></fieldset>
        <fieldset><legend>Flags</legend><div class="opts" id="flags"></div></fieldset>
        <fieldset><legend>Operators, forward-only</legend><div class="chips" id="chips"></div><input type="text" id="ops"></fieldset>
      </form>
      <fieldset><legend id="notes-label">Notes</legend><textarea id="notes" placeholder="Why you changed or vetoed it, or anything worth recording"></textarea></fieldset>
    </section>
    <section class="card" id="deltacard"></section>
  </main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const STEPS = JSON.parse(document.getElementById('data').textContent);
const KINDS = ['none','add','reshape','discard','derive','repair','re-encode'];
const FLAGS = [['e','emits-moves'],['o','outside-read'],['j','judgement']];
const CAMBRIA = new Set(['add','remove','rename','hoist','plunge','wrap','head','in','map','convert']);
const EXTRA = ['filter','container','compute','read','re-encode'];
const VOCAB = new Set([...CAMBRIA, ...EXTRA]);
const SHARED = {}; STEPS.forEach(s => { const c = s.delta.commit.slice(0,10); SHARED[c] = (SHARED[c]||0) + 1; });

let db = null, cur = 0, dec = {}, timers = {}, seq = {}, pending = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opNames = s => (String(s||'').toLowerCase().match(/[a-z][a-z-]*/g) || []).filter(t => VOCAB.has(t));
const composable = j => !!j && opNames(j.ops).every(t => CAMBRIA.has(t)) && !String(j.flags||'').trim();
const flagSet = f => [...new Set(String(f||'').replace(/[^eoj]/g,''))].sort().join('');
const severity = s => !s.B ? 0 : (s.A.kind !== s.B.kind || composable(s.A) !== composable(s.B)) ? 2 : flagSet(s.A.flags) !== flagSet(s.B.flags) ? 1 : 0;
const disagree = s => severity(s) > 0;
const status = s => (dec[s.id] && dec[s.id].decision) ? (dec[s.id].decision.startsWith('approve') ? 'approve' : dec[s.id].decision) : 'pending';

$('kinds').innerHTML = KINDS.map(k => `<label class="opt"><input type="radio" name="kind" value="${k}" id="k-${k}">${k}</label>`).join('');
$('flags').innerHTML = FLAGS.map(([k,n]) => `<label class="opt"><input type="checkbox" name="flag" value="${k}" id="f-${k}">${k} · ${n}</label>`).join('');
$('chips').innerHTML = [...CAMBRIA].map(o => `<button type="button" class="chip" data-op="${o}">${o}</button>`).join('')
  + EXTRA.map(o => `<button type="button" class="chip x" data-op="${o}" title="Not a Cambria operator">${o}</button>`).join('');

function visible() {
  const fs = $('fsys').value, ft = $('fstat').value;
  return STEPS.map((s, i) => [s, i]).filter(([s]) => (!fs || (fs[0] === '@' ? (s.layer || 'system') === fs.slice(1) : s.system === fs)) &&
    (!ft || (ft === 'disagree' ? disagree(s) : ft === 'major' ? severity(s) === 2 : status(s) === ft)));
}
const GROUPS = { 2: 'Priority: kind or verdict differs', 1: 'Check: flags differ', 0: 'Agents agree' };
function ordered() {
  const v = visible();
  if ($('fsort').value !== 'priority') return v.map(x => [...x, x[0].system]);
  return v.map(x => [...x, GROUPS[severity(x[0])] + (status(x[0]) === 'pending' ? '' : ' (decided)')])
    .sort((a, b) => (severity(b[0]) - severity(a[0])) || ((status(a[0]) === 'pending' ? 0 : 1) - (status(b[0]) === 'pending' ? 0 : 1)) || (a[1] - b[1]));
}
function renderTally() {
  const n = k => STEPS.filter(s => status(s) === k).length;
  const nl = l => STEPS.filter(s => (s.layer || 'system') === l).length;
  $('tally').innerHTML = `<span class="pill"><b>${STEPS.length - n('pending')}</b> of ${STEPS.length} decided (${nl('system')} system steps, ${nl('userspace')} userspace rows)</span>
    <span class="pill">approved <b>${n('approve')}</b></span><span class="pill">modified <b>${n('modify')}</b></span><span class="pill">vetoed <b>${n('veto')}</b></span>
    <span class="pill">priority <b>${STEPS.filter(s => severity(s) === 2 && status(s) === 'pending').length}</b> pending of ${STEPS.filter(s => severity(s) === 2).length}</span>
    <span class="pill">flag-only <b>${STEPS.filter(s => severity(s) === 1).length}</b></span>`;
}
function renderList() {
  const v = ordered(); let html = '', last = '';
  const pri = $('fsort').value === 'priority';
  for (const [s, i, g] of v) {
    if (g !== last) { html += `<h3>${esc(g)}</h3>`; last = g; }
    const sev = severity(s);
    html += `<button type="button" data-i="${i}" aria-current="${i===cur}"><span class="st ${status(s)}"></span>${esc((pri ? s.system + ' ' : '') + (s.sub ? s.sub + ' ' : '') + s.step)}${s.B ? `<span class="b sev${sev}">${sev === 2 ? 'A≠B' : sev === 1 ? 'flags' : 'A=B'}</span>` : ''}</button>`;
  }
  $('list').innerHTML = html || '<div class="empty">No steps match.</div>';
  renderTally();
}
function judgeCard(label, j, other) {
  if (!j) return `<div class="judge"><h4>${label}</h4><div class="note">Not yet coded by the second coder.</div></div>`;
  const d = (f, a, b) => other && a !== b ? ' class="diffv"' : '';
  const c = composable(j);
  return `<div class="judge"><h4>${label}</h4><dl class="kv">
    <dt>kind</dt><dd${d('k', j.kind, other && other.kind)}>${esc(j.kind)}</dd>
    <dt>flags</dt><dd${d('f', flagSet(j.flags), other && flagSet(other.flags))}>${esc(flagSet(j.flags) || '—')}</dd>
    <dt>ops</dt><dd>${esc(j.ops || '(identity)')}</dd>
    <dt>verdict</dt><dd${d('v', c, other && composable(other))}><span class="verdict ${c ? 'yes' : 'no'}">${c ? 'composable' : 'not composable'}</span></dd>
    ${j.confidence ? `<dt>confidence</dt><dd>${esc(j.confidence)}</dd>` : ''}
  </dl>${j.notes ? `<div class="jnote">${esc(j.notes)}</div>` : ''}</div>`;
}
function renderStep() {
  const s = STEPS[cur], d = dec[s.id] || {};
  $('stepcard').innerHTML = `<div class="meta"><h2>${esc(s.system)}${s.sub ? ' / ' + esc(s.sub) : ''} ${esc(s.step)}</h2>
    <span>${s.layer === 'userspace' ? 'userspace row · ' : ''}${esc(s.date)} (${s.dateKind === 'develop' ? 'merge to develop' : 'introducing commit'})</span>${s.evidence ? `<span>${esc(s.evidence)}</span>` : ''}</div>
    ${severity(s) ? `<div class="note" style="margin-top:6px;color:var(${severity(s) === 2 ? '--veto' : '--mod'})">${severity(s) === 2 ? 'Priority: the agents disagree on kind or on the composable verdict.' : 'The agents disagree only on flags.'}</div>` : ''}
    <div class="judges">${judgeCard('Agent A · first coder', s.A, s.B)}${judgeCard('Agent B · second coder' + (s.B && s.B.sample ? ' (sample)' : ''), s.B, s.A)}</div>`;
  const pressed = x => (d.decision === x) ? 'true' : 'false';
  $('decide').innerHTML = `<button type="button" class="btn approve" id="d-a" aria-pressed="${pressed('approve-A')}">Approve A</button>
    ${s.B ? `<button type="button" class="btn approve" id="d-b" aria-pressed="${pressed('approve-B')}">Approve B</button>` : ''}
    <button type="button" class="btn modify" id="d-m" aria-pressed="${pressed('modify')}">Modify</button>
    <button type="button" class="btn veto" id="d-v" aria-pressed="${pressed('veto')}">Veto</button>
    ${d.decision ? `<button type="button" class="btn" id="d-clear">Clear</button>` : ''}
    <span class="save" id="save">${d.decision ? 'Saved' : 'Pending'}</span>`;
  $('d-a').onclick = () => decide('approve-A');
  if (s.B) $('d-b').onclick = () => decide('approve-B');
  $('d-m').onclick = () => decide('modify');
  $('d-v').onclick = () => decide('veto');
  if (d.decision) $('d-clear').onclick = () => decide(null);
  const showForm = d.decision === 'modify';
  $('form').hidden = !showForm;
  if (showForm) {
    document.querySelectorAll('input[name=kind]').forEach(x => x.checked = x.value === d.kind);
    document.querySelectorAll('input[name=flag]').forEach(x => x.checked = String(d.flags||'').includes(x.value));
    $('ops').value = d.ops || '';
  }
  $('notes').value = d.notes || '';
  $('notes-label').textContent = d.decision === 'veto' ? 'Reason for veto' : 'Notes';
  const lines = (s.delta.diff || '').split('\n').map(l => {
    const c = /^(diff --git|index |--- |\+\+\+ )/.test(l) ? 'meta' : l.startsWith('@@') ? 'hunk' : l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : '';
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
  }).join('\n');
  const shared = SHARED[s.delta.commit.slice(0,10)] - 1;
  $('deltacard').innerHTML = `<div class="meta"><span><b>What changed.</b> ${s.delta.how === 'develop merge' ? 'Merge that landed this version on develop' : 'Introducing commit'}: ${esc(s.delta.commit)}</span></div>
    <div class="note">Showing ${esc(s.delta.hunks)} hunks that mention this step's versions${s.delta.truncated ? ', cut at 240 lines' : ''}.${shared > 0 ? ` This commit also lands ${shared} other step${shared > 1 ? 's' : ''} in the census.` : ''} <a href="${esc(s.delta.url)}" target="_blank" rel="noopener">Full commit on GitHub</a></div>
    <pre aria-label="Diff">${lines || 'No diff found.'}</pre>`;
  renderList();
}
function decide(kind) {
  const s = STEPS[cur], prev = dec[s.id] || {};
  if (!kind) { dec[s.id] = { decision: '', notes: prev.notes || '' }; persist(s); renderStep(); return; }
  let body;
  if (kind === 'approve-A') body = { kind: s.A.kind, flags: flagSet(s.A.flags), ops: s.A.ops };
  else if (kind === 'approve-B') body = { kind: s.B.kind, flags: flagSet(s.B.flags), ops: s.B.ops };
  else if (kind === 'modify') body = prev.decision === 'modify' ? { kind: prev.kind, flags: prev.flags, ops: prev.ops } : { kind: s.A.kind, flags: flagSet(s.A.flags), ops: s.A.ops };
  else body = { kind: '', flags: '', ops: '' };
  dec[s.id] = { ...body, decision: kind, notes: $('notes').value.trim() };
  persist(s); renderStep();
  if (kind === 'modify') $('form').querySelector('input[name=kind]:checked, input[name=kind]')?.focus();
  if (kind === 'veto') $('notes').focus();
}
function readModify() {
  const s = STEPS[cur], d = dec[s.id]; if (!d || d.decision !== 'modify') return;
  dec[s.id] = { ...d,
    kind: (document.querySelector('input[name=kind]:checked') || {}).value || '',
    flags: [...document.querySelectorAll('input[name=flag]:checked')].map(x => x.value).join(''),
    ops: $('ops').value.trim() };
}
function persist(s) {
  if (!db) { $('save').textContent = 'Not saved: storage unavailable'; $('save').className = 'save err'; return; }
  $('save').textContent = 'Saving…'; $('save').className = 'save';
  pending.add(s.id);
  const mine = seq[s.id] = (seq[s.id] || 0) + 1;
  clearTimeout(timers[s.id]);
  timers[s.id] = setTimeout(async () => {
    const body = { ...dec[s.id] };
    try {
      await db.collection('decisions').doc(s.id).set({ system: s.system, sub: s.sub, step: s.step,
        decision: body.decision || '', kind: body.kind || '', flags: body.flags || '', ops: body.ops || '',
        notes: body.notes || '', composable: body.decision && body.decision !== 'veto' ? composable(body) : null,
        reviewedAt: new Date().toISOString() });
      if (seq[s.id] === mine) pending.delete(s.id);
      if (STEPS[cur].id === s.id) $('save').textContent = body.decision ? 'Saved' : 'Cleared';
    } catch (e) {
      if (seq[s.id] === mine) pending.delete(s.id);
      if (STEPS[cur].id === s.id) { $('save').textContent = 'Not saved: ' + (e && e.message || 'error'); $('save').className = 'save err'; }
    }
  }, 400);
}
$('form').addEventListener('input', () => { readModify(); persist(STEPS[cur]); });
$('form').addEventListener('change', () => { readModify(); persist(STEPS[cur]); });
$('notes').addEventListener('input', () => { const s = STEPS[cur]; dec[s.id] = { ...(dec[s.id] || { decision: '' }), notes: $('notes').value }; persist(s); });
$('chips').addEventListener('click', e => {
  const op = e.target.dataset && e.target.dataset.op; if (!op) return;
  const t = $('ops'); const tok = (op === 'in' || op === 'map') ? op + '(' : op;
